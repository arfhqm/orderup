spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/orderup_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

server.port=8080

# CORS (for Angular dev server)
app.cors.allowed-origins=http://localhost:4200

# Optional AI polish. Local recommendation rules still work without a key.
openai.api.key=${OPENAI_API_KEY:}
openai.api.url=${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}
openai.api.model=${OPENAI_API_MODEL:gpt-4o-mini}
